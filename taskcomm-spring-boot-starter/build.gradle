// Ни одного класса (docs/adr/0001-module-layout.md) — только список зависимостей. Класс,
// попавший в этот модуль, — ошибка: смысл модуля именно в том, что он только объявляет api.
//
// BOM Spring Boot сюда не добавлять (docs/adr/0106-starter-does-not-export-bom.md): платформа
// в api попадает в опубликованные метаданные и у Gradle-потребителя поднимает все зависимости
// из BOM до наших версий. Версии зависимостей стартера — явные, из каталога. Проверяет это
// задача verifyNoExportedPlatform в корневом build.gradle.
//
// Драйвер PostgreSQL стартер не везёт: его версию и способ подключения выбирает потребитель.
dependencies {
    api project(':taskcomm-autoconfigure')
    api libs.spring.boot.starter
    api libs.spring.boot.starter.jdbc
    api libs.spring.boot.starter.jackson
}
