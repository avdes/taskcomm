// Единственный модуль с кодом (docs/adr/0001). Зависимости на Spring Boot — compileOnly:
// реальные транзитивы для потребителя собираются в taskcomm-spring-boot-starter через api.
plugins {
    id 'checkstyle'
    alias(libs.plugins.spotless)
    alias(libs.plugins.errorprone)
}

dependencies {
    compileOnly platform(libs.spring.boot.bom)
    testImplementation platform(libs.spring.boot.bom)

    compileOnly libs.spring.boot.autoconfigure
    // JdbcClient, DataSourceScriptDatabaseInitializer и автоконфигурации DataSource, после которых
    // встаёт наша. Потребителю это приезжает через spring-boot-starter-jdbc в стартере.
    compileOnly libs.spring.boot.jdbc
    compileOnly libs.jackson.databind
    annotationProcessor libs.spring.boot.configuration.processor
    annotationProcessor libs.spring.boot.autoconfigure.processor

    compileOnly libs.jetbrains.annotations
    compileOnly libs.slf4j.api

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    annotationProcessor libs.lombok.mapstruct.binding

    compileOnly libs.mapstruct
    annotationProcessor libs.mapstruct.processor

    errorprone libs.errorprone.core

    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok

    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.boot.starter.jdbc
    testImplementation libs.jackson.databind
    testImplementation libs.archunit.junit5
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.liquibase.core
    testRuntimeOnly libs.postgresql
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Разделение тестов по имени класса (docs/adr/0108-integration-test-task.md): test — только *Test,
// без Docker; integrationTest — только *IT на PostgreSQL в Testcontainers (docs/adr/0085), входит
// в check. Набор исходников один — src/test.
tasks.named('test', Test) {
    include '**/*Test.class'
}

// Liquibase ветки 4 для теста совместимости changelog (docs/adr/0092). Отдельная конфигурация без BOM:
// в общем classpath тестов Liquibase 5 из BOM, и две версии одного артефакта там не уживаются.
// Тест грузит эти jar изолированным загрузчиком классов.
configurations {
    liquibase4 {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    liquibase4 libs.liquibase4.core
    liquibase4 libs.liquibase4.picocli
}

def integrationTest = tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Интеграционные тесты (*IT) на PostgreSQL в Testcontainers. Нужен Docker.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IT.class'
    shouldRunAfter tasks.named('test')
    def liquibase4 = configurations.liquibase4
    inputs.files(liquibase4).withPropertyName('liquibase4')
    jvmArgumentProviders.add({ ["-Dtaskcomm.test.liquibase4.classpath=${liquibase4.asPath}"] } as CommandLineArgumentProvider)
}

tasks.named('check') {
    dependsOn integrationTest
}

checkstyle {
    toolVersion = libs.versions.checkstyle.get()
    configFile = rootProject.file('checkstyle.xml')
    // checkstyle.xml ссылается на checkstyle-suppressions.xml через ${taskcomm_config_dir}, а не
    // ${config_loc}: этим именем с Gradle 9 владеет сам плагин checkstyle (через configDirectory,
    // который для нас означал бы рекурсивное хеширование всего корня репозитория как input —
    // включая .gradle/, что и падает). Своё имя свойства обходит оба ограничения.
    configProperties = ['taskcomm_config_dir': rootProject.projectDir.absolutePath]
}

spotless {
    // Единый источник правды о переносе строк — .gitattributes (LF везде), а не платформа сборки.
    lineEndings = com.diffplug.spotless.LineEnding.GIT_ATTRIBUTES_FAST_ALLSAME

    java {
        // Известная граблина (см. CLAUDE.md, «Каталог версий»): форматирование новых конструкций
        // Java (sealed, pattern matching в switch, unnamed-паттерны) надёжно работает, только если
        // Gradle daemon сам запущен на JDK версии toolchain — отсюда проверка JDK в settings.gradle.
        palantirJavaFormat(libs.versions.palantir.java.format.get())
        removeUnusedImports()
        importOrder()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.withType(JavaCompile).configureEach {
    // net.ltgt.errorprone требует именно эту связку флагов компилятора (см. CLAUDE.md,
    // «Известные грабли сборки»); add-exports/add-opens для доступа к внутренностям javac
    // плагин добавляет сам.
    options.compilerArgs << '-XDcompilePolicy=simple' << '--should-stop=ifError=FLOW'
    options.errorprone {
        // Lombok генерирует код в том же раунде компиляции, что видит Error Prone — точечно
        // не считаем это чужим кодом источником ошибок, а не глушим правило целиком.
        disableWarningsInGeneratedCode = true
    }
}
