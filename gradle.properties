# -Dfile.encoding=UTF-8 — обязателен на Windows: без него Gradle daemon читает *.gradle
# и *.java с кириллицей в комментариях в системной кодировке, а не в UTF-8 (см. CLAUDE.md,
# «Кодировка UTF-8, перевод строки LF»).
org.gradle.jvmargs=-Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
